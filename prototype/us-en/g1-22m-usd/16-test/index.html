<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your goal weight · YouthGenom</title>
<link rel="stylesheet" href="/youthgenom-funnel-redesign/prototype/us-en/g1-22m-usd/redesign/rd.css?v=32">
<script src="/youthgenom-funnel-redesign/prototype/us-en/g1-22m-usd/redesign/rd.js?v=32"></script>
</head>
<body>
<main class="page">
  <div data-rd-header></div>

  <h1 class="rd-title">What's your goal weight?</h1>
  <!-- No pre-filled value and no suggestion button: she types her own goal (R-16); the card below gives feedback. -->
  <p class="rd-sub">A 5–10% loss is a great first goal. You can change it later.</p>

  <div class="rd-field">
    <label class="rd-label" for="t">Goal weight</label>
    <div class="rd-input-wrap" id="wrap"><input class="rd-input" id="t" type="text" inputmode="decimal" maxlength="5" autocomplete="off" aria-describedby="err goal"><span class="rd-unit" id="u">lbs</span></div>
    <p class="rd-error" id="err" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
      <span id="errText"></span>
    </p>
  </div>

  <!-- Goal feedback, like the reference: how big the goal is, and how her BMI changes (R-22). -->
  <div class="rd-goalcard" id="goal" hidden aria-live="polite">
    <span class="rd-goalcard__tag" id="tag"></span>
    <p class="rd-goalcard__title" id="gTitle"></p>
    <p class="rd-goalcard__text" id="gText"></p>
    <div class="rd-divider" style="margin:14px 0"></div>
    <div class="rd-bmihead"><p class="rd-bmihead__title">Your BMI</p><span class="rd-badge" id="bmiBadge"></span></div>
    <div id="bmiScale"></div>
    <button class="rd-link" type="button" id="aboutBtn" aria-expanded="false" aria-controls="about">About Body Mass Index (BMI)</button>
    <div class="rd-about" id="about" hidden></div>
  </div>
</main>
<div class="rd-cta-bar"><div class="rd-cta-bar__inner"><button class="rd-cta" type="button" id="cta" disabled>Continue</button></div></div>
<script>
  RD.header("16-test");
  var s = RD.load(), metric = s.unit === "metric", current = s.weightLbs || 180, inches = RD.heightInches(s);
  var input = document.getElementById("t"), wrap = document.getElementById("wrap"), err = document.getElementById("err"), cta = document.getElementById("cta");
  function toU(l) { return metric ? RD.kg(l) : Math.round(l); }
  function toL(v) { return metric ? RD.lbsFromKg(+v) : +v; }
  var minL = inches ? Math.ceil(18.5 * inches * inches / 703) : 90, maxL = current - 1, unitTxt = metric ? "kg" : "lbs";
  document.getElementById("u").textContent = unitTxt;
  input.placeholder = "e.g. " + toU(Math.round(current * 0.92));
  // In kg, show the nearest whole kg values that pass the lbs check, so the numbers in the text are always accepted.
  var minU = toU(minL), maxU = toU(maxL);
  if (metric) { while (toL(minU) < minL) minU++; while (toL(maxU) > maxL) maxU--; }
  document.getElementById("errText").textContent = "Goal weight must be between " + minU + " and " + maxU + " " + unitTxt + ": below your current weight and within a healthy range for your height.";
  if (s.targetLbs) input.value = toU(s.targetLbs);
  RD.bmiAbout(document.getElementById("aboutBtn"), document.getElementById("about"));

  var CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
  var BOLT = '<svg width="12" height="12" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';
  function pill(el, b) { var i = RD.bmiInfo(b); el.textContent = b.toFixed(1); el.className = "rd-bmi__pill rd-bmi__pill--" + i.cls; }
  function update(showError) {
    var v = input.value.trim().replace(",", "."), num = /^\d+(\.\d)?$/.test(v), l = num ? toL(v) : 0, ok = num && l >= minL && l <= maxL;
    cta.disabled = !ok;
    var bad = v !== "" && !ok && (showError || v.length >= 3);
    wrap.classList.toggle("is-error", bad); wrap.classList.toggle("is-valid", ok); err.classList.toggle("is-visible", bad);
    document.getElementById("goal").hidden = !ok;
    if (!ok) return;
    var pct = Math.round((1 - l / current) * 100), diff = toU(current) - toU(l), tag = document.getElementById("tag"), easy = pct <= 10;
    tag.className = "rd-goalcard__tag rd-goalcard__tag--" + (easy ? "easy" : "effort");
    tag.innerHTML = '<span class="rd-goalcard__ico">' + (easy ? CHECK : BOLT) + '</span>' + (pct <= 5 ? "Easy win" : pct <= 10 ? "A healthy goal" : pct <= 15 ? "It takes some effort" : "An ambitious goal");
    document.getElementById("gTitle").innerHTML = "You'll lose " + pct + "% of your body weight" + '<span class="rd-delta rd-delta--' + (easy ? "easy" : "effort") + '">−' + diff + " " + unitTxt + "</span>";
    document.getElementById("gText").textContent = pct <= 10 ? "5–10% is a good rule of thumb: enough to feel the difference, and realistic to keep." : "That's more than the usual 5–10% first step. Your plan can start there and keep going.";
    var b0 = RD.bmi(current, inches), b1 = RD.bmi(l, inches);
    if (b0 && b1) { var ci = RD.bmiInfo(b0), badge = document.getElementById("bmiBadge"); badge.textContent = ci.badge; badge.className = "rd-badge rd-badge--" + ci.cls; document.getElementById("bmiScale").innerHTML = RD.bmiScale(b0, b1); }
  }
  input.addEventListener("input", function () { update(false); });
  input.addEventListener("blur", function () { update(true); });
  // Nothing to lose: her current weight is already at (or below) BMI 18.5 for her height, so no goal range exists.
  // Instead of an impossible error, the plan keeps her weight steady and she can go on.
  var keep = minL > maxL;
  function showKeep() {
    document.querySelector(".rd-sub").textContent = "Your weight is already at the lower end of the healthy range for your height, so there's no weight to lose.";
    document.querySelector(".rd-field").hidden = true;
    var tag = document.getElementById("tag");
    tag.className = "rd-goalcard__tag rd-goalcard__tag--easy";
    tag.innerHTML = '<span class="rd-goalcard__ico">' + CHECK + '</span>Keep it steady';
    document.getElementById("gTitle").textContent = "Your plan will keep your weight steady";
    document.getElementById("gText").textContent = "It focuses on strength, energy and balanced meals instead of weight loss.";
    var b0 = RD.bmi(current, inches);
    if (b0) { var ci = RD.bmiInfo(b0), badge = document.getElementById("bmiBadge"); badge.textContent = ci.badge; badge.className = "rd-badge rd-badge--" + ci.cls; document.getElementById("bmiScale").innerHTML = RD.bmiScale(b0); }
    document.getElementById("goal").hidden = false;
    cta.disabled = false;
  }
  cta.onclick = function () { RD.save({ targetLbs: keep ? current : toL(input.value.trim().replace(",", ".")) }); RD.next("16-test"); };
  if (keep) showKeep(); else update(false);
</script>
</body>
</html>
