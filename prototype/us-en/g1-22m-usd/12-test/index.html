<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your age · YouthGenom</title>
<link rel="stylesheet" href="/youthgenom-funnel-redesign/prototype/us-en/g1-22m-usd/redesign/rd.css?v=32">
<script src="/youthgenom-funnel-redesign/prototype/us-en/g1-22m-usd/redesign/rd.js?v=32"></script>
</head>
<body>
<main class="page">
  <div data-rd-header></div>

  <h1 class="rd-title">How old are you?</h1>
  <!-- Say why we ask (R-12). -->
  <p class="rd-sub">Your age helps us set your calorie needs and how hard your workouts should be.</p>

  <div class="rd-field">
    <label class="rd-label" for="age">Age</label>
    <div class="rd-input-wrap" id="wrap">
      <input class="rd-input" id="age" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="e.g. 54" autocomplete="off" aria-describedby="err">
      <span class="rd-unit">years</span>
    </div>
    <!-- Validation states the rule, not just "invalid" (R-14). -->
    <p class="rd-error" id="err" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
      <span>Age must be a whole number from 18 to 100.</span>
    </p>
  </div>
</main>
<div class="rd-cta-bar"><div class="rd-cta-bar__inner"><button class="rd-cta" type="button" id="cta" disabled>Continue</button></div></div>
<script>
  RD.header("12-test");
  var input = document.getElementById("age"), wrap = document.getElementById("wrap"), err = document.getElementById("err"), cta = document.getElementById("cta");
  var s = RD.load(); if (s.age) input.value = s.age;
  function valid(v) { return /^\d+$/.test(v) && +v >= 18 && +v <= 100; }
  function update(showError) {
    var v = input.value.trim(), ok = valid(v);
    cta.disabled = !ok;
    var bad = v !== "" && !ok && (showError || v.length >= 2);
    wrap.classList.toggle("is-error", bad); wrap.classList.toggle("is-valid", ok);
    err.classList.toggle("is-visible", bad); input.setAttribute("aria-invalid", bad ? "true" : "false");
  }
  input.addEventListener("input", function () { update(false); });
  input.addEventListener("blur", function () { update(true); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !cta.disabled) cta.click(); });
  cta.onclick = function () { RD.save({ age: +input.value.trim() }); RD.next("12-test"); };
  update(false);
</script>
</body>
</html>
